; Battery powered remote temp/humidity sensors and the two-board gateway that forwards them to MQTT.
;
;   sensor-node     battery sensor, ESP-NOW -> gateway-radio
;   gateway-radio   ESP-NOW receiver on a fixed channel, UART -> gateway-uplink
;   gateway-uplink  WiFi client, UART -> MQTT on tiger-pi
;
; ESPNOW_CHANNEL must match between sensor-node and gateway-radio (default in remote_sensor_protocol.h)

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = -<*>

; Single CR123A through a 3.3V boost converter; battery divider on A1, switched by a MOSFET on D2
[env:sensor-node]
build_flags =
	-DSLEEP_S=300
	-DBATTERY_ADC_PIN=A1
	-DBATTERY_ENABLE_PIN=D2
	-DBATTERY_DIVIDER=2.0
	-DBATTERY_CAPACITY_MAH=1300
lib_deps =
	adafruit/Adafruit SHT4x Library@^1.0.5
build_src_filter = ${env.build_src_filter} +<sensor-node.cpp>

; Same as sensor-node but stays awake long enough to print over USB, and reads every 30s
[env:sensor-node-debug]
extends = env:sensor-node
build_flags =
	-DSLEEP_S=30
	-DBATTERY_ADC_PIN=A1
	-DBATTERY_ENABLE_PIN=D2
	-DBATTERY_DIVIDER=2.0
	-DBATTERY_CAPACITY_MAH=1300
	-DSENSOR_DEBUG

[env:gateway-radio]
build_flags =
	-DUPLINK_TX_PIN=D6
	-DUPLINK_RX_PIN=D7
build_src_filter = ${env.build_src_filter} +<gateway-radio.cpp>

[env:gateway-uplink]
; Shares the controller's WiFi credentials (wifi-info.h, not committed) and embedded-shared libs
build_flags =
	-I ../../controller/code/src
	-DRADIO_TX_PIN=D6
	-DRADIO_RX_PIN=D7
	-DHOSTNAME=\"greenhouse-sensor-gateway\"
	-DLOG_TO_SYSLOG=true
lib_extra_dirs = ../../controller/code/lib/embedded-shared/esp32
lib_deps =
	arcao/Syslog@^2.0.0
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8
build_src_filter = ${env.build_src_filter} +<gateway-uplink.cpp>
