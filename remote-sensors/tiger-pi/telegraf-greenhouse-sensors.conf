# /etc/telegraf/telegraf.d/greenhouse-sensors.conf
#
# Copies remote sensor readings from MQTT into the same "weather" measurement the controller writes,
# tagged device=greenhouse-remote and sensor_id=<sensor MAC>.
#
# Telegraf sends every input to every output, so if this Telegraf already has other outputs, add
#   [outputs.<name>.tagdrop]
#     device = ["greenhouse-remote"]
# to them, or these readings will land there too.

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["greenhouse/sensors/+/state"]
  client_id = "telegraf-greenhouse-sensors"
  qos = 1
  persistent_session = true
  name_override = "weather"
  # The topic is parsed into sensor_id below; don't also store it as a tag
  topic_tag = ""
  data_format = "json_v2"

  [inputs.mqtt_consumer.tags]
    device = "greenhouse-remote"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "greenhouse/sensors/+/state"
    tags = "_/_/sensor_id/_"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      # Readings are retained, so the same message is redelivered whenever Telegraf reconnects.
      # Using the gateway's timestamp makes those redeliveries overwrite the same point.
      timestamp_key = "ts"
      timestamp_format = "unix"
      excluded_keys = ["id"]

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
  database = "greenhouse"
  skip_database_creation = true
  [outputs.influxdb.tagpass]
    device = ["greenhouse-remote"]
